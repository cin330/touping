[project]
name = "touping"
version = "1.0.0"
description = "安卓投屏工具：scrcpy 的 Windows 托盘外壳"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "pywin32==312",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pyinstaller==6.22.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
